# A Cloudflare executa `npx wrangler preview` a partir da raiz do repositório.
# Produção: mesmos valores de worker/wrangler.toml, com o caminho relativo ajustado.
name = "gex-talents-api"
main = "worker/src/index.js"
compatibility_date = "2026-10-01"

[vars]
ALLOWED_ORIGIN = "https://recursoshumanos-2026.github.io"
APPLICATIONS_ENABLED = "true"
PROSPECT_CHANNEL_ID = "8"
RESUME_UPLOAD_ENABLED = "false"
# Retencao automatica somente no D1, 12 meses; Recrutei nunca e alterada.
RESUME_RETENTION_ENABLED = "true"
RESUME_RETENTION_DRY_RUN = "false"
RESUME_RETENTION_MONTHS = "12"

# Prévia isolada: candidaturas reais permanecem bloqueadas até autorização.
# Segredos da Recrutei são configurados exclusivamente no painel da Cloudflare.
[previews.vars]
ALLOWED_ORIGIN = "https://gex-talents-previa-questionario.yasmimbsouza80.chatgpt.site"
APPLICATIONS_ENABLED = "true"
PROSPECT_CHANNEL_ID = "8"
RESUME_UPLOAD_ENABLED = "false"
# Preview permanece sem exclusao real.
RESUME_RETENTION_ENABLED = "true"
RESUME_RETENTION_DRY_RUN = "true"
RESUME_RETENTION_MONTHS = "12"
RESUME_DIAGNOSTIC_ENABLED = "true"

# Consulta somente leitura, restrita ao registro fictício já usado na homologação.
PROFILE_DIAGNOSTIC_ENABLED = "true"
PROFILE_DIAGNOSTIC_APPLICATION_ID = "15905660"
PROFILE_DIAGNOSTIC_VACANCY_ID = "158928"
PROFILE_DIAGNOSTIC_WRITE_ENABLED = "true"

# Enables PDF/DOCX -> Markdown conversion when RESUME_UPLOAD_ENABLED is true.
# Execute all safe local unit tests before constructing a Worker preview.
[build]
command = "npm run check && npm test"

[ai]
binding = "AI"

# D1 Free storage: create a database in Cloudflare > D1, apply worker/schema.sql
# and replace the database_id with its real value. Keep the feature OFF until tested.
# [[d1_databases]]
# binding = "RESUME_DB"
# database_name = "gex-talents-curriculos-gratis"
# database_id = "UUID_DO_BANCO_D1"
# This does not add any public endpoint to candidate curricula.

# Workers AI configurado somente na Base de Prévias pelo painel Cloudflare.
[previews.ai]
binding = "AI"

# Sincronizado com a associação "Base de Prévias" feita no painel Cloudflare.
# Usado somente por Worker Previews; não cria binding D1 em produção.
[[previews.d1_databases]]
binding = "RESUME_DB"
database_name = "gex-talents-curriculos-teste"
database_id = "5b71acd5-8203-48e5-9d33-3396cfa76ffb"

# Verificação diária da retenção de currículos, 06:00 UTC.
# Handler protegido: sem autorização explícita, não consulta nem exclui dados.
[triggers]
crons = ["0 6 * * *"]
