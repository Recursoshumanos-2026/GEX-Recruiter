name = "gex-talents-api"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
ALLOWED_ORIGIN = "https://recursoshumanos-2026.github.io"
APPLICATIONS_ENABLED = "true"
PROSPECT_CHANNEL_ID = "8"
RESUME_UPLOAD_ENABLED = "false"
# Retencao automatica somente no D1, 12 meses; Recrutei nunca e alterada.
RESUME_RETENTION_ENABLED = "true"
RESUME_RETENTION_DRY_RUN = "false"
RESUME_RETENTION_MONTHS = "12"

# Enables PDF/DOCX -> Markdown conversion when RESUME_UPLOAD_ENABLED is true.
[ai]
binding = "AI"

# Cloudflare D1 - banco privado de curriculos de producao.
# Associacao ja criada manualmente na Cloudflare; manter sincronizada no deploy.
# O upload permanece DESATIVADO ate homologacao da Recrutei.
[[d1_databases]]
binding = "RESUME_DB"
database_name = "gex-talents-curriculos"
database_id = "a9bbf8f5-4677-49d5-b1a5-cc4d967fec98"
# Sem rota publica para leitura de curriculos.

# Retenção Cloudflare D1: cron diário. Exclusão desativada por padrão.
[triggers]
crons = ["0 6 * * *"]
